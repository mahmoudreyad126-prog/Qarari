plugins {
    id 'com.android.application'
}

android {
    namespace 'com.qarari.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.qarari.app"
        minSdk 23
        targetSdk 35
        versionCode 100
        versionName "Final"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


dependencies {
    implementation 'androidx.core:core:1.15.0'
}
